<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owner Ordela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: satu kolom tumpuk di ponsel (sapaan, skor, filter status, kartu ringkasan, daftar user, tombol kuning melayang); di layar lebar daftar menjadi tabel. */
:root {
  --bg: #14161b;
  --surface: #1e2128;
  --surface-2: #2a2e37;
  --line: #353a46;
  --fg: #f2f3f6;
  --muted: #9aa1af;
  --accent: #ffc81e;
  --on-accent: #17181c;
  --ok: #9bdc6b;
  --warn: #ff9f43;
  --crit: #ff6b6b;
  --info: #6fb0ff;
  --violet: #a58bff;
  --scrim: rgba(8, 9, 12, .66);
  --font: 'Red Hat Display', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e8eaee; --surface: #ffffff; --surface-2: #f0f1f5; --line: #d5d8e0;
    --fg: #181a20; --muted: #5b6272; --ok: #2b7f1c; --warn: #b05600; --crit: #c02f2d;
    --info: #1c62c4; --violet: #6244d1; --scrim: rgba(20, 22, 28, .45);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e8eaee; --surface: #ffffff; --surface-2: #f0f1f5; --line: #d5d8e0;
  --fg: #181a20; --muted: #5b6272; --ok: #2b7f1c; --warn: #b05600; --crit: #c02f2d;
  --info: #1c62c4; --violet: #6244d1; --scrim: rgba(20, 22, 28, .45);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #14161b; --surface: #1e2128; --surface-2: #2a2e37; --line: #353a46;
  --fg: #f2f3f6; --muted: #9aa1af; --ok: #9bdc6b; --warn: #ff9f43; --crit: #ff6b6b;
  --info: #6fb0ff; --violet: #a58bff; --scrim: rgba(8, 9, 12, .66);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-block: 20px 170px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; align-items: center; gap: 14px; }
.top .who-me { flex: 1; min-width: 0; }
.top .hello { color: var(--muted); font-size: 14px; }
.top h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.avatar {
  --c: var(--info);
  display: grid; place-items: center; flex: none;
  width: 44px; height: 44px; border-radius: 50%;
  font-weight: 700; font-size: 15px; color: var(--c);
  background: color-mix(in srgb, var(--c) 20%, var(--surface-2));
}
.avatar.lg { width: 60px; height: 60px; font-size: 21px; }
.icon-btn {
  position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--line); background: transparent;
}
.icon-btn:hover { background: var(--surface); }
.icon-btn .dot { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Kartu kuning utama */
.hero {
  background: var(--accent); color: var(--on-accent);
  border-radius: 28px; padding: 22px 22px 22px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.hero h2 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.1; }
.hero p { margin: 4px 0 0; font-size: 14px; font-weight: 500; opacity: .8; }
.hero .big { position: relative; width: 92px; height: 92px; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 20px; }
.hero .big svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .big .t { fill: none; stroke: rgba(23, 24, 28, .16); stroke-width: 7; }
.hero .big .v { fill: none; stroke: var(--on-accent); stroke-width: 7; stroke-linecap: round; transition: stroke-dasharray .5s ease; }

/* Filter status */
.sect-label { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: var(--fg); }
.tiles-status { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.chip {
  border: 0; border-radius: 20px; background: var(--surface); padding: 12px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
}
.chip b { font-size: 22px; font-weight: 800; line-height: 1.1; }
.chip span { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] span { color: var(--on-accent); opacity: .8; }

/* Kartu ringkasan */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.stat .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.stat .val { font-size: 32px; font-weight: 700; line-height: 1; }
.stat .lbl { font-weight: 600; }
.stat .hint { font-size: 12.5px; color: var(--muted); }
.ring { --c: var(--info); position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--c) 18%, var(--surface-2)); color: var(--c); }
.ring svg.r { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring .rt { fill: none; stroke: transparent; stroke-width: 3; }
.ring .rv { fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; }
.ring svg.i { width: 18px; height: 18px; position: relative; }

/* Toolbar */
.toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { position: relative; }
.field.search { grid-column: 1 / -1; }
.field .i { position: absolute; left: 14px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.input, .select {
  width: 100%; height: 46px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 14px;
}
.field.search .input { padding-left: 42px; }
.input::placeholder { color: var(--muted); }
.input:focus-visible, .select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

/* Daftar */
.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.list-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.list-head span { color: var(--muted); font-size: 13px; }
.cols { display: none; }
ul.users { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.row {
  width: 100%; text-align: left; border: 0; border-radius: 22px; background: var(--surface);
  padding: 14px 16px; display: grid; gap: 10px 12px; align-items: center;
  grid-template-columns: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "who who who chev" "role stat last last";
}
.row:hover { background: var(--surface-2); }
.who { grid-area: who; display: flex; align-items: center; gap: 12px; min-width: 0; }
.who .txt { min-width: 0; }
.who .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .em { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .you { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--accent); color: var(--on-accent); margin-left: 6px; vertical-align: 1px; }
.c-role { grid-area: role; font-size: 13px; font-weight: 600; color: var(--muted); }
.c-stat { grid-area: stat; }
.c-last { grid-area: last; font-size: 13px; color: var(--muted); }
.chev { grid-area: chev; color: var(--muted); }
.pill {
  --c: var(--ok);
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px;
  font-size: 12.5px; font-weight: 600; color: var(--c);
  background: color-mix(in srgb, var(--c) 16%, transparent);
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.pending { --c: var(--warn); }
.pill.suspended { --c: var(--crit); }
.empty { background: var(--surface); border-radius: 22px; padding: 32px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }
.note { color: var(--muted); font-size: 12.5px; text-align: center; margin: 0; }

@media (min-width: 760px) {
  .tiles-status { max-width: 520px; }
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .toolbar { grid-template-columns: minmax(0, 1fr) 190px 190px; }
  .field.search { grid-column: auto; }
  .cols, .row {
    grid-template-columns: minmax(0, 2.4fr) 110px 140px 150px 20px;
    grid-template-areas: "who role stat last chev";
  }
  .cols { display: grid; gap: 12px; padding: 0 16px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .cols span:nth-child(5) { grid-column: 5; }
}

/* Tombol melayang */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  display: flex; flex-direction: column; gap: 10px;
  padding: 28px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 46%); }
.nav { pointer-events: auto; width: 100%; max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 30px; padding: 6px; }
.nav button { border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px 7px; border-radius: 24px; font-size: 12px; font-weight: 600; }
.nav button:hover { color: var(--fg); }
.nav button[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.view { display: flex; flex-direction: column; gap: 22px; }
.card { background: var(--surface); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card h3 { margin: 0; font-size: 17px; font-weight: 700; }
.card .sub { color: var(--muted); font-size: 13px; margin: -8px 0 0; }
.stack { display: flex; height: 16px; border-radius: 99px; overflow: hidden; gap: 3px; }
.stack i { display: block; min-width: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.bars li { display: grid; grid-template-columns: minmax(70px, 38%) minmax(0, 1fr) 28px; align-items: center; gap: 12px; font-size: 14px; }
.bars .bl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .bt { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bars .bt i { display: block; height: 100%; border-radius: 99px; }
.bars b { text-align: right; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fab {
  pointer-events: auto; display: flex; align-items: center; justify-content: space-between;
  width: 100%; max-width: 960px; margin: 0 auto; height: 56px; padding: 0 12px 0 24px; border: 0;
  border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px;
}
.fab .plus { width: 34px; height: 34px; border-radius: 50%; background: var(--on-accent); color: var(--accent); display: grid; place-items: center; }
.fab:hover { filter: brightness(1.05); }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; padding-top: env(safe-area-inset-top, 0px); }
.sheet {
  width: 100%; max-width: 480px; max-height: 92%; overflow: auto; background: var(--surface);
  border-radius: 28px 28px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 28px; padding-bottom: 22px; } }
.sheet-top { display: flex; align-items: center; gap: 14px; }
.sheet-top .txt { flex: 1; min-width: 0; }
.sheet-top h2 { margin: 0; font-size: 21px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.sheet-top .em { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.info div { background: var(--surface-2); border-radius: 16px; padding: 10px 14px; min-width: 0; }
.info dt { font-size: 12px; color: var(--muted); }
.info dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.lbl-f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.lbl-f .input, .lbl-f .select { background: var(--surface-2); color: var(--fg); }
.actions { display: flex; flex-direction: column; gap: 10px; }
.btn { height: 48px; border-radius: 99px; border: 0; background: var(--surface-2); font-weight: 700; padding: 0 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { filter: brightness(1.12); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, var(--surface-2)); }
.btn.solid-danger { background: var(--crit); color: #17181c; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-stack { display: flex; flex-direction: column; gap: 12px; }
.list-head #addOwnerBtn { height: 40px; padding: 0 16px; font-size: 13px; white-space: nowrap; }
.confirm { background: color-mix(in srgb, var(--crit) 12%, var(--surface-2)); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.confirm p { margin: 0; font-weight: 600; }
.err { color: var(--crit); font-size: 13px; margin: 0; }
.hint-line { color: var(--muted); font-size: 13px; margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); translate: -50% 12px; z-index: 40;
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px); text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, translate .2s;
}
.toast.show { opacity: 1; translate: -50% 0; }
@media (prefers-reduced-motion: reduce) { .toast, .hero .big .v { transition: none; } }
[hidden] { display: none !important; }
body { margin: 0; }
:root { --mint: #c9e7cf; --on-mint: #16251b; }
.gate { max-width: 440px; margin: 0 auto; padding-top: 3vh; display: flex; flex-direction: column; gap: 14px; }
.login-hero { position: relative; overflow: hidden; background: var(--mint); color: var(--on-mint); border-radius: 32px; padding: 26px 24px 30px; min-height: 250px; display: flex; flex-direction: column; gap: 12px; }
.login-hero .brand { font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.login-hero h1 { margin: 0; font-size: 36px; line-height: 1.08; font-weight: 500; letter-spacing: -.015em; text-wrap: balance; position: relative; z-index: 1; }
.login-hero h1 b { font-weight: 800; }
.login-hero p { margin: 0; max-width: 21ch; font-size: 14.5px; line-height: 1.45; opacity: .82; position: relative; z-index: 1; }
.login-hero svg { position: absolute; right: -34px; bottom: -52px; width: 140px; height: 140px; }
.login-card { background: var(--surface); border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.login-card form { display: flex; flex-direction: column; gap: 14px; }
.pw { position: relative; }
.pw .input { padding-right: 76px; }
.pw button { position: absolute; right: 6px; top: 50%; translate: 0 -50%; height: 34px; padding: 0 12px; border: 0; border-radius: 99px; background: var(--surface); color: var(--muted); font-weight: 600; font-size: 13px; }
.pw button:hover { color: var(--fg); }
.login-alt { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.linkbtn { border: 0; background: transparent; color: var(--fg); font-weight: 600; font-size: 14px; height: 42px; border-radius: 99px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.linkbtn:hover { background: var(--surface-2); }
.gate-msg { margin: 0; font-weight: 600; }

.pill.new { --c: var(--info); }
.chip { padding-inline: 2px; }
.chip span { font-size: 11.5px; }
.c-role { min-width: 0; font-size: 13px; }
.c-role b { display: block; font-weight: 700; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-role small { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.row { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "who who chev" "role stat stat" "last last last"; }
@media (min-width: 760px) {
  .cols, .row { grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.4fr) 130px 130px 20px; grid-template-areas: "who role stat last chev"; }
}
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); border-radius: 99px; padding: 4px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font-weight: 600; height: 38px; border-radius: 99px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow: auto; }
.log li { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.log .l { min-width: 0; overflow-wrap: anywhere; }
.log .r { color: var(--muted); white-space: nowrap; font-size: 12.5px; text-align: right; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<main class="gate" id="gate" hidden>
  <section class="login-hero">
    <span class="brand">Ordela</span>
    <h1>Halo lagi,<br><b>admin Ordela</b></h1>
    <p>Masuk untuk mengelola owner, toko, dan paket langganan.</p>
    <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="#1e2128"/><g stroke="#c9e7cf" stroke-width="12" stroke-linecap="round" fill="none"><path d="M100 100 100 22M100 100 32 140M100 100 168 140"/><circle cx="100" cy="100" r="64"/></g></svg>
  </section>
  <section class="login-card">
    <p class="gate-msg" id="gateMsg" role="status" hidden></p>
    <form id="loginForm" novalidate>
      <label class="lbl-f" for="loginEmail">Email<input class="input" id="loginEmail" type="email" autocomplete="username" placeholder="nama@email.com"></label>
      <label class="lbl-f" for="loginPw">Kata sandi<span class="pw"><input class="input" id="loginPw" type="password" autocomplete="current-password" placeholder="Kata sandi"><button type="button" id="pwToggle" aria-label="Tampilkan kata sandi">Lihat</button></span></label>
      <p class="hint-line" id="loginMsg" role="status" style="margin:0"></p>
      <button type="submit" class="btn primary" id="loginBtn">Masuk</button>
    </form>
    <div class="login-alt" id="loginAlt">
      <button type="button" class="linkbtn" id="magicBtn">Masuk lewat tautan email</button>
      <button type="button" class="linkbtn" id="forgotBtn">Lupa atau belum punya kata sandi?</button>
    </div>
    <form id="resetForm" hidden novalidate>
      <label class="lbl-f" for="resetPw">Kata sandi baru<input class="input" id="resetPw" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter"></label>
      <p class="err" id="resetErr" role="alert" hidden></p>
      <button type="submit" class="btn primary">Simpan dan masuk</button>
    </form>
    <button type="button" class="btn" id="gateOut" hidden>Keluar</button>
  </section>
</main>

<div class="app" id="appRoot" hidden>
  <header class="top">
    <div class="avatar" id="meAv" style="--c: var(--accent)" aria-hidden="true">OA</div>
    <div class="who-me">
      <div class="hello">Admin Ordela</div>
      <h1 id="pageTitle">Owner</h1>
    </div>
    <button class="icon-btn" id="bell" type="button" aria-label="Owner baru">
      <svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg>
      <span class="dot" id="bellDot" hidden></span>
    </button>
  </header>

  <div class="view" id="view-home">
    <section class="hero" aria-live="polite">
      <div>
        <h2>Owner baru</h2>
        <p id="heroSub" class="num"></p>
      </div>
      <div class="big num" id="heroRing"></div>
    </section>

    <section aria-labelledby="statusLabel">
      <h2 class="sect-label" id="statusLabel">Tampilkan owner dengan status</h2>
      <div class="tiles-status" id="statusTiles"></div>
    </section>

    <section class="stats" id="stats" aria-label="Ringkasan"></section>

    <section aria-labelledby="listTitle">
      <div class="list-head">
        <h2 id="listTitle">Semua owner</h2>
        <span class="num" id="count"></span>
        <button type="button" class="btn primary" id="addOwnerBtn">+ Tambah User</button>
      </div>
      <div class="toolbar">
        <div class="field search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="q" type="search" placeholder="Cari nama, email, atau toko" autocomplete="off" aria-label="Cari owner">
        </div>
        <select class="select" id="planFilter" aria-label="Filter paket"><option value="all">Semua paket</option></select>
        <select class="select" id="sort" aria-label="Urutkan">
          <option value="recent">Terbaru daftar</option>
          <option value="name">Nama A–Z</option>
          <option value="active">Terakhir masuk</option>
        </select>
      </div>
      <div style="height:12px"></div>
      <div class="cols" aria-hidden="true"><span>Owner</span><span>Toko dan paket</span><span>Status</span><span>Terdaftar</span><span></span></div>
      <ul class="users" id="users"></ul>
    </section>
  </div>

  <div class="view" id="view-analytics" hidden></div>
  <div class="view" id="view-profile" hidden></div>
</div>

<div class="dock" id="dock" hidden>
  <nav class="nav" aria-label="Navigasi utama">
    <button type="button" data-tab="home" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Beranda</span></button>
    <button type="button" data-tab="analytics"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span>Analitik</span></button>
    <button type="button" data-tab="profile"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></svg><span>Profil</span></button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ICON = {
    chev: '<svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
    users: '<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.7 2.4 3 5.2"/></svg>',
    store: '<svg class="i" viewBox="0 0 24 24"><path d="M4 9 5.5 4h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5 12v8h14v-8"/></svg>',
    spark: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>',
    card: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>'
  };
  var STATUS = { new: 'Baru', active: 'Aktif', suspended: 'Ditangguhkan' };
  var PAID = ['pro', 'business', 'enterprise'];
  var TONES = ['--info', '--violet', '--ok', '--warn', '--crit'];
  var SUBST = { active: 'Aktif', trialing: 'Uji coba', past_due: 'Menunggak', cancelled: 'Dibatalkan', expired: 'Kedaluwarsa', grandfathered: 'Legacy (dilindungi)', suspended: 'Ditangguhkan' };
  var ACTION_LABEL = { plan_changed: 'Paket diubah', owner_suspended: 'Owner ditangguhkan', owner_activated: 'Owner diaktifkan' };

  var SB_URL = 'https://txnpqiiwdtgtfgkrquty.supabase.co';
  var SB_KEY = 'sb_publishable_e1IZBxl3Menz3-N4ehFXkA_rxNLM7t8';
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  var owners = [], plans = [], planNames = {};
  var adminEmail = '';
  var state = { status: 'all', q: '', plan: 'all', sort: 'recent' };
  var openId = null, detailData = null, detailTab = 'bill', busy = false, lastFocus = null, toastTimer;

  async function api(action, extra) {
    var r = await sb.functions.invoke('owner-admin', { body: Object.assign({ action: action }, extra || {}) });
    if (r.error) {
      var msg = r.error.message, status = r.error.context && r.error.context.status;
      try { var j = await r.error.context.json(); if (j && j.error) msg = j.error; } catch (e) { /* abaikan */ }
      var err = new Error(msg); err.status = status; throw err;
    }
    return r.data;
  }

  function daysAgo(ts) { if (!ts) return null; return Math.max(0, Math.floor((Date.now() - new Date(ts).getTime()) / 86400000)); }
  function norm(r) {
    var o = Object.assign({}, r);
    o.joinedDays = daysAgo(r.joined); o.lastDays = daysAgo(r.last_login);
    o.status = !r.active ? 'suspended' : (!r.store_id || (o.joinedDays !== null && o.joinedDays <= 14)) ? 'new' : 'active';
    o.planName = r.plan_code ? (planNames[r.plan_code] || r.plan_code) : null;
    return o;
  }
  function initials(n) { var p = String(n || '?').trim().split(/\s+/); return ((p[0] || '')[0] + ((p[1] || '')[0] || '')).toUpperCase(); }
  function tone(n) { var h = 0; n = String(n || ''); for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0; return TONES[h % TONES.length]; }
  function avatar(o, lg) { return '<span class="avatar' + (lg ? ' lg' : '') + '" style="--c:var(' + tone(o.owner_name) + ')" aria-hidden="true">' + esc(initials(o.owner_name)) + '</span>'; }
  function rel(d, zero) { if (d === null) return '-'; if (d === 0) return zero || 'Hari ini'; if (d === 1) return 'Kemarin'; if (d < 30) return d + ' hari lalu'; var m = Math.round(d / 30); return m < 12 ? m + ' bulan lalu' : (Math.round(m / 12 * 10) / 10).toString().replace('.', ',') + ' tahun lalu'; }
  function dateTxt(ts) { return ts ? new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-'; }
  function money(minor, cur) {
    var n = Number(minor) / 100;
    try { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: (cur || 'USD').trim(), maximumFractionDigits: 2 }).format(n); } catch (e) { return n + ' ' + cur; }
  }
  function pill(s) { return '<span class="pill ' + s + '">' + STATUS[s] + '</span>'; }
  function count(fn) { return owners.filter(fn).length; }
  function ring(p, color, icon) {
    var c = 2 * Math.PI * 18;
    return '<span class="ring" style="--c:var(' + color + ')"><svg class="r" viewBox="0 0 44 44" aria-hidden="true"><circle class="rt" cx="22" cy="22" r="18"/><circle class="rv" cx="22" cy="22" r="18" transform="rotate(-90 22 22)" stroke-dasharray="' + (c * Math.max(p, 4) / 100).toFixed(1) + ' ' + c.toFixed(1) + '"/></svg>' + icon + '</span>';
  }
  function bigRing(p) {
    var c = 2 * Math.PI * 40;
    return '<svg viewBox="0 0 92 92" aria-hidden="true"><circle class="t" cx="46" cy="46" r="40"/><circle class="v" cx="46" cy="46" r="40" transform="rotate(-90 46 46)" stroke-dasharray="' + (c * p / 100).toFixed(1) + ' ' + c.toFixed(1) + '"/></svg><span>' + p + '%</span>';
  }
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3000); }

  async function load() {
    var d = await api('list');
    plans = d.plans || []; planNames = {};
    plans.forEach(function (p) { planNames[p.code] = p.name; });
    owners = d.owners.map(norm);
    var sel = $('#planFilter'), keep = sel.value;
    sel.innerHTML = '<option value="all">Semua paket</option>' + plans.map(function (p) { return '<option value="' + esc(p.code) + '">' + esc(p.name) + '</option>'; }).join('') + '<option value="none">Belum ada paket</option>';
    sel.value = Array.prototype.some.call(sel.options, function (o) { return o.value === keep; }) ? keep : 'all';
    renderAll();
  }

  function renderHero() {
    var total = owners.length, fresh = count(function (o) { return o.joinedDays !== null && o.joinedDays <= 30; });
    var noStore = count(function (o) { return !o.store_id; });
    var pct = total ? Math.round((total - noStore) / total * 100) : 0;
    $('#heroSub').textContent = fresh + ' mendaftar 30 hari terakhir, ' + noStore + ' belum punya toko';
    $('#heroRing').innerHTML = bigRing(pct);
    $('#heroRing').setAttribute('aria-label', pct + '% owner sudah membuka toko');
    var n = count(function (o) { return o.status === 'new'; });
    $('#bellDot').hidden = n === 0;
    $('#bell').setAttribute('aria-label', n + ' owner baru');
  }
  function renderTiles() {
    var defs = [['all', 'Semua', owners.length], ['new', 'Baru', count(function (o) { return o.status === 'new'; })], ['active', 'Aktif', count(function (o) { return o.status === 'active'; })], ['suspended', 'Ditangguhkan', count(function (o) { return o.status === 'suspended'; })]];
    $('#statusTiles').innerHTML = defs.map(function (d) { return '<button type="button" class="chip" data-status="' + d[0] + '" aria-pressed="' + (state.status === d[0]) + '"><b class="num">' + d[2] + '</b><span>' + d[1] + '</span></button>'; }).join('');
  }
  function renderStats() {
    var total = owners.length || 1;
    var stores = count(function (o) { return !!o.store_id; });
    var staff = owners.reduce(function (a, o) { return a + (o.staff_count || 0); }, 0);
    var paid = count(function (o) { return PAID.indexOf(o.plan_code) > -1; });
    var cards = [
      [owners.length, 'Total owner', 'Semua yang terdaftar', 100, '--info', ICON.users],
      [stores, 'Toko dibuat', staff + ' staf di seluruh toko', stores / total * 100, '--ok', ICON.store],
      [owners.length - stores, 'Belum punya toko', 'Perlu dibantu memulai', (owners.length - stores) / total * 100, '--warn', ICON.spark],
      [paid, 'Paket berbayar', 'Pro, Business, Enterprise', paid / total * 100, '--violet', ICON.card]
    ];
    $('#stats').innerHTML = cards.map(function (c) {
      return '<div class="stat"><div class="row1"><span class="val num">' + c[0] + '</span>' + ring(c[3], c[4], c[5]) + '</div><div><div class="lbl">' + c[1] + '</div><div class="hint">' + c[2] + '</div></div></div>';
    }).join('');
  }
  function filtered() {
    var q = state.q.trim().toLowerCase();
    var list = owners.filter(function (o) {
      if (state.status !== 'all' && o.status !== state.status) return false;
      if (state.plan === 'none' ? !!o.plan_code : (state.plan !== 'all' && o.plan_code !== state.plan)) return false;
      if (q && ((o.owner_name || '') + ' ' + (o.email || '') + ' ' + (o.store_name || '') + ' ' + (o.store_code || '')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    list.sort(function (a, b) {
      if (state.sort === 'name') return String(a.owner_name).localeCompare(String(b.owner_name), 'id');
      if (state.sort === 'active') return (a.lastDays === null ? 9999 : a.lastDays) - (b.lastDays === null ? 9999 : b.lastDays);
      return (a.joinedDays === null ? 9999 : a.joinedDays) - (b.joinedDays === null ? 9999 : b.joinedDays);
    });
    return list;
  }
  function renderList() {
    var list = filtered();
    $('#count').textContent = list.length + ' dari ' + owners.length + ' owner';
    if (!list.length) { $('#users').innerHTML = '<li class="empty"><b>Tidak ada owner yang cocok</b>Ubah kata kunci atau filter untuk melihat owner lain.</li>'; return; }
    $('#users').innerHTML = list.map(function (o) {
      return '<li><button type="button" class="row" data-id="' + esc(o.owner_id) + '" aria-label="Buka detail ' + esc(o.owner_name) + '">' +
        '<span class="who">' + avatar(o) + '<span class="txt"><div class="nm">' + esc(o.owner_name || 'Tanpa nama') + '</div><div class="em">' + esc(o.email || '-') + '</div></span></span>' +
        '<span class="c-role"><b>' + (o.store_name ? esc(o.store_name) : 'Belum ada toko') + '</b><small>' + (o.planName ? 'Paket ' + esc(o.planName) : 'Belum ada paket') + '</small></span>' +
        '<span class="c-stat">' + pill(o.status) + '</span>' +
        '<span class="c-last">' + rel(o.joinedDays) + '</span>' +
        '<span class="chev">' + ICON.chev + '</span></button></li>';
    }).join('');
  }
  function renderAll() { renderHero(); renderTiles(); renderStats(); renderList(); }

  /* Detail */
  function byId(id) { return owners.filter(function (o) { return o.owner_id === id; })[0]; }
  function tabHTML() {
    if (detailData === null) return '<p class="hint-line">Memuat data toko...</p>';
    if (detailTab === 'bill') {
      if (!detailData.invoices.length) return '<p class="hint-line">Belum ada tagihan untuk toko ini.</p>';
      return '<ul class="log">' + detailData.invoices.map(function (v) {
        return '<li><span class="l"><b>' + esc(v.invoice_number) + '</b><br><span style="color:var(--muted)">' + esc(v.status) + '</span></span><span class="r num">' + esc(money(v.total_minor, v.currency)) + '<br>' + esc(dateTxt(v.created_at)) + '</span></li>';
      }).join('') + '</ul>';
    }
    if (!detailData.activity.length) return '<p class="hint-line">Belum ada aktivitas tercatat.</p>';
    return '<ul class="log">' + detailData.activity.map(function (a) {
      var label = ACTION_LABEL[a.action] || a.action;
      return '<li><span class="l"><b>' + esc(label) + '</b><br><span style="color:var(--muted)">' + esc(a.who || '-') + (a.detail ? ' · ' + esc(a.detail) : '') + '</span></span><span class="r">' + esc(dateTxt(a.t)) + '</span></li>';
    }).join('') + '</ul>';
  }
  function detailHTML(o, confirmSuspend) {
    var sub = o.sub_status ? ((SUBST[o.sub_status] || o.sub_status) + (o.current_period_end ? ', sampai ' + dateTxt(o.current_period_end) : '')) : '-';
    var statusBtn = o.active
      ? '<button type="button" class="btn danger" data-act="suspend">Tangguhkan owner</button>'
      : '<button type="button" class="btn primary" data-act="activate">Aktifkan kembali</button>';
    var confirmBox = confirmSuspend
      ? '<div class="confirm"><p>Tangguhkan ' + esc(o.owner_name) + '? Owner dan ' + (o.staff_count || 0) + ' stafnya langsung keluar dan tidak bisa masuk lagi.</p><div class="pair"><button type="button" class="btn" data-act="cancel-suspend">Batal</button><button type="button" class="btn solid-danger" data-act="do-suspend">Ya, tangguhkan</button></div></div>'
      : statusBtn;
    var planSel = o.store_id
      ? '<label class="lbl-f" for="planSel">Paket langganan<select class="select" id="planSel">' + (o.plan_code ? '' : '<option value="" selected disabled>Pilih paket</option>') + plans.map(function (p) { return '<option value="' + esc(p.code) + '"' + (p.code === o.plan_code ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') + '</select></label>'
      : '<p class="hint-line">Owner ini belum membuat toko, jadi paket dan tagihan belum bisa diatur.</p>';
    var tabs = o.store_id
      ? '<div class="tabs" role="tablist"><button type="button" role="tab" data-tab2="bill" aria-selected="' + (detailTab === 'bill') + '">Tagihan</button><button type="button" role="tab" data-tab2="log" aria-selected="' + (detailTab === 'log') + '">Aktivitas</button></div><div id="tabBody">' + tabHTML() + '</div>'
      : '';
    return '<div class="sheet-top">' + avatar(o, true) + '<div class="txt"><h2 id="sheetTitle">' + esc(o.owner_name) + '</h2><div class="em">' + esc(o.email || '-') + '</div><div style="margin-top:6px">' + pill(o.status) + '</div></div>' +
      '<button type="button" class="icon-btn" data-act="close" aria-label="Tutup"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
      '<dl class="info"><div><dt>Toko</dt><dd>' + (o.store_name ? esc(o.store_name) + ' <span style="color:var(--muted);font-weight:500">(' + esc(o.store_code) + ')</span>' : 'Belum ada') + '</dd></div>' +
      '<div><dt>Staf</dt><dd>' + (o.store_id ? (o.staff_count || 0) + ' orang' : '-') + '</dd></div>' +
      '<div><dt>Terdaftar</dt><dd>' + esc(dateTxt(o.joined)) + '</dd></div>' +
      '<div><dt>Terakhir masuk</dt><dd>' + (o.lastDays === null ? 'Belum pernah' : rel(o.lastDays)) + '</dd></div>' +
      '<div><dt>Telepon</dt><dd>' + esc(o.phone || '-') + '</dd></div>' +
      '<div><dt>Langganan</dt><dd>' + esc(sub) + '</dd></div></dl>' +
      planSel + tabs + '<div class="actions">' + confirmBox + '</div>';
  }
  function paintSheet(confirmSuspend) { var o = byId(openId); if (!o) return; $('#sheet').innerHTML = detailHTML(o, !!confirmSuspend); }
  function openSheet(html) {
    lastFocus = document.activeElement; $('#sheet').innerHTML = html; $('#scrim').hidden = false;
    var f = $('#sheet').querySelector('button, select'); if (f) f.focus();
  }
  function openCreateOwner() {
    openId = null;
    openSheet(
      '<div class="sheet-top"><div class="txt"><h2 id="sheetTitle">Tambah User</h2><div class="em">Buat akun Owner baru untuk Ordela</div></div>' +
      '<button type="button" class="icon-btn" data-act="close" aria-label="Tutup"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
      '<form id="createOwnerForm" class="form-stack" novalidate>' +
      '<label class="lbl-f" for="newOwnerName">Nama lengkap<input class="input" id="newOwnerName" name="name" maxlength="60" autocomplete="name" placeholder="Nama pemilik akun" required></label>' +
      '<label class="lbl-f" for="newOwnerEmail">Email<input class="input" id="newOwnerEmail" name="email" type="email" maxlength="120" autocomplete="email" placeholder="nama@email.com" required></label>' +
      '<div class="hint-line">Jabatan akun: <b>Owner</b>. Undangan aktivasi akan dikirim ke email. Akun dibuat tanpa toko atau data transaksi.</div>' +
      '<p class="err" id="createOwnerErr" role="alert" hidden></p>' +
      '<button type="submit" class="btn primary" id="createOwnerSubmit">Buat akun &amp; kirim undangan</button>' +
      '</form>'
    );
    setTimeout(function () { var input = $('#newOwnerName'); if (input) input.focus(); }, 30);
  }

  function closeSheet() { $('#scrim').hidden = true; $('#sheet').innerHTML = ''; openId = null; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
  async function openDetail(id) {
    var o = byId(id); if (!o) return;
    openId = id; detailData = null; detailTab = 'bill';
    openSheet(detailHTML(o, false));
    if (!o.store_id) return;
    try {
      var d = await api('detail', { store_id: o.store_id });
      if (openId === id) { detailData = d; var b = $('#tabBody'); if (b) b.innerHTML = tabHTML(); }
    } catch (e) { if (openId === id) { detailData = { invoices: [], activity: [] }; var b2 = $('#tabBody'); if (b2) b2.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; } }
  }
  async function mutate(fn, okMsg) {
    if (busy) return; busy = true;
    try {
      await fn(); await load();
      var o = byId(openId);
      if (o) { detailData = null; paintSheet(false); if (o.store_id) { try { detailData = await api('detail', { store_id: o.store_id }); var b = $('#tabBody'); if (b) b.innerHTML = tabHTML(); } catch (e) { /* abaikan */ } } }
      toast(okMsg);
    } catch (e) { toast('Gagal: ' + e.message); paintSheet(false); }
    finally { busy = false; }
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest('#addOwnerBtn')) { openCreateOwner(); return; }
    var row = t.closest('.row'); if (row) { openDetail(row.dataset.id); return; }
    var chip = t.closest('.chip'); if (chip) { state.status = chip.dataset.status; renderTiles(); renderList(); return; }
    if (t.closest('#bell')) { var n = count(function (o) { return o.status === 'new'; }); toast(n ? n + ' owner baru perlu dicek' : 'Tidak ada owner baru'); return; }
    if (t === $('#scrim')) { closeSheet(); return; }
    var tb = t.closest('[data-tab2]'); if (tb) { detailTab = tb.dataset.tab2; document.querySelectorAll('[data-tab2]').forEach(function (b) { b.setAttribute('aria-selected', String(b === tb)); }); $('#tabBody').innerHTML = tabHTML(); return; }
    var b = t.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.dataset.act, o = byId(openId);
    if (act === 'close') closeSheet();
    else if (act === 'suspend') paintSheet(true);
    else if (act === 'cancel-suspend') paintSheet(false);
    else if (act === 'do-suspend') mutate(function () { return api('set_active', { owner_id: o.owner_id, active: false }); }, o.owner_name + ' ditangguhkan');
    else if (act === 'activate') mutate(function () { return api('set_active', { owner_id: o.owner_id, active: true }); }, o.owner_name + ' diaktifkan kembali');
  });
  document.addEventListener('submit', async function (e) {
    if (e.target.id !== 'createOwnerForm') return;
    e.preventDefault();
    if (busy) return;
    var name = $('#newOwnerName').value.trim().replace(/\\s+/g, ' ');
    var email = $('#newOwnerEmail').value.trim().toLowerCase();
    var err = $('#createOwnerErr'), btn = $('#createOwnerSubmit');
    err.hidden = true;
    if (name.length < 2 || name.length > 60) { err.textContent = 'Nama harus 2-60 karakter.'; err.hidden = false; return; }
    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email) || email.length > 120) { err.textContent = 'Masukkan alamat email yang valid.'; err.hidden = false; return; }
    busy = true; btn.disabled = true; btn.textContent = 'Membuat akun...';
    try {
      await api('create_owner', { name: name, email: email });
      closeSheet();
      toast('Undangan Owner dikirim ke ' + email);
      try { await load(); }
      catch (loadError) { toast('Akun dibuat, tetapi daftar belum diperbarui. Muat ulang halaman.'); }
    } catch (error) {
      err.textContent = error.message || 'Gagal membuat akun Owner.';
      err.hidden = false;
    } finally {
      busy = false;
      if (btn.isConnected) { btn.disabled = false; btn.textContent = 'Buat akun & kirim undangan'; }
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'planSel') {
      var o = byId(openId), p = e.target.value;
      mutate(function () { return api('set_plan', { store_id: o.store_id, plan_code: p }); }, 'Paket ' + o.store_name + ' kini ' + (planNames[p] || p));
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
  $('#q').addEventListener('input', function (e) { state.q = e.target.value; renderList(); });
  $('#planFilter').addEventListener('change', function (e) { state.plan = e.target.value; renderList(); });
  $('#sort').addEventListener('change', function (e) { state.sort = e.target.value; renderList(); });

  /* Analitik dan profil */
  function bars(items) {
    var max = Math.max.apply(null, items.map(function (i) { return i[1]; }).concat(1));
    return '<ul class="bars">' + items.map(function (i) {
      return '<li><span class="bl">' + esc(i[0]) + '</span><span class="bt"><i style="width:' + (i[1] / max * 100).toFixed(0) + '%;background:var(' + i[2] + ')"></i></span><b class="num">' + i[1] + '</b></li>';
    }).join('') + '</ul>';
  }
  function renderAnalytics() {
    var total = owners.length;
    var paid = count(function (o) { return PAID.indexOf(o.plan_code) > -1; });
    var pct = total ? Math.round(paid / total * 100) : 0;
    var planItems = plans.map(function (p, i) { return [p.name, count(function (o) { return o.plan_code === p.code; }), ['--ok', '--info', '--violet', '--warn', '--crit'][i % 5]]; });
    planItems.push(['Belum ada paket', count(function (o) { return !o.plan_code; }), '--warn']);
    var st = [['Baru', 'new', '--info'], ['Aktif', 'active', '--ok'], ['Ditangguhkan', 'suspended', '--crit']].map(function (s) { return [s[0], count(function (o) { return o.status === s[1]; }), s[2]]; });
    var months = [], now = new Date();
    for (var k = 5; k >= 0; k--) { var d = new Date(now.getFullYear(), now.getMonth() - k, 1); months.push({ y: d.getFullYear(), m: d.getMonth(), label: d.toLocaleDateString('id-ID', { month: 'short', year: '2-digit' }), n: 0 }); }
    owners.forEach(function (o) { if (!o.joined) return; var d = new Date(o.joined); months.forEach(function (m) { if (m.y === d.getFullYear() && m.m === d.getMonth()) m.n++; }); });
    $('#view-analytics').innerHTML =
      '<section class="hero"><div><h2>Owner berbayar</h2><p class="num">' + paid + ' dari ' + total + ' owner memakai paket Pro ke atas</p></div><div class="big num">' + bigRing(pct) + '</div></section>' +
      '<div class="grid2"><section class="card"><h3>Owner per paket</h3>' + bars(planItems) + '</section>' +
      '<section class="card"><h3>Pendaftaran per bulan</h3>' + bars(months.map(function (m) { return [m.label, m.n, '--info']; })) + '</section></div>' +
      '<section class="card"><h3>Sebaran status</h3><div class="stack" role="img" aria-label="' + st.map(function (s) { return s[0] + ' ' + s[1]; }).join(', ') + '">' +
      st.filter(function (s) { return s[1] > 0; }).map(function (s) { return '<i style="flex:' + s[1] + ';background:var(' + s[2] + ')"></i>'; }).join('') + '</div>' +
      '<ul class="legend">' + st.map(function (s) { return '<li><i style="background:var(' + s[2] + ')"></i>' + s[0] + ' <b class="num">' + s[1] + '</b></li>'; }).join('') + '</ul></section>';
  }
  function renderProfile() {
    var stores = count(function (o) { return !!o.store_id; });
    $('#view-profile').innerHTML =
      '<section class="card"><div class="sheet-top"><span class="avatar lg" style="--c:var(--accent)" aria-hidden="true">' + esc(initials(adminEmail.split('@')[0])) + '</span><div class="txt"><h2 style="margin:0;font-size:20px;font-weight:800;overflow-wrap:anywhere">' + esc(adminEmail) + '</h2><div class="em" style="color:var(--muted)">Admin Ordela</div></div></div>' +
      '<p class="hint-line" style="margin:0">Kamu bisa melihat ' + owners.length + ' owner dan ' + stores + ' toko, mengubah paket, dan menangguhkan owner.</p></section>' +
      '<form class="card" id="pwForm" novalidate><h3>Kata sandi</h3><p class="hint-line" style="margin:0">Buat kata sandi supaya bisa masuk tanpa menunggu email.</p><label class="lbl-f" for="newPw">Kata sandi baru<input class="input" id="newPw" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter"></label><p class="err" id="pwErr" role="alert" hidden></p><button type="submit" class="btn primary">Simpan kata sandi</button></form>' +
      '<button type="button" class="btn" id="logoutBtn">Keluar</button>';
  }
  var TITLES = { home: 'Owner', analytics: 'Analitik owner', profile: 'Profil' };
  function showTab(t) {
    ['home', 'analytics', 'profile'].forEach(function (k) { $('#view-' + k).hidden = k !== t; });
    document.querySelectorAll('.nav button').forEach(function (b) { if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $('#pageTitle').textContent = TITLES[t];
    if (t === 'analytics') renderAnalytics();
    if (t === 'profile') renderProfile();
    window.scrollTo(0, 0);
  }
  document.querySelector('.nav').addEventListener('click', function (e) { var b = e.target.closest('button[data-tab]'); if (b) showTab(b.dataset.tab); });

  /* Masuk */
  function showGate(on, msg, mode) {
    $('#gate').hidden = !on; $('#appRoot').hidden = on; $('#dock').hidden = on;
    if (!on) return;
    mode = mode || 'login';
    $('#loginForm').hidden = mode !== 'login'; $('#loginAlt').hidden = mode !== 'login';
    $('#resetForm').hidden = mode !== 'reset'; $('#gateOut').hidden = mode !== 'denied';
    $('#gateMsg').textContent = msg || ''; $('#gateMsg').hidden = !msg;
  }
  async function sendLink(email) {
    var r = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: false } });
    return r.error;
  }
  var booting = false;
  var recovering = location.hash.indexOf('type=recovery') > -1;
  async function boot() {
    if (booting) return; booting = true;
    try {
      var sess = (await sb.auth.getSession()).data.session;
      if (!sess) { showGate(true, '', 'login'); return; }
      adminEmail = (sess.user.email || '').toLowerCase();
      if (recovering) return;
      try { await load(); }
      catch (e) {
        showGate(true, e.status === 403 ? adminEmail + ' tidak punya akses admin Ordela.' : 'Data belum bisa dimuat: ' + e.message, 'denied');
        return;
      }
      $('#meAv').textContent = initials(adminEmail.split('@')[0]);
      showGate(false);
    } finally { booting = false; }
  }
  function say(id, text, bad) { var el = $(id); el.textContent = text; el.style.color = bad ? 'var(--crit)' : ''; }
  $('#pwToggle').addEventListener('click', function () {
    var i = $('#loginPw'), show = i.type === 'password'; i.type = show ? 'text' : 'password';
    this.textContent = show ? 'Sembunyi' : 'Lihat'; this.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
  });
  $('#loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var em = $('#loginEmail').value.trim().toLowerCase(), pw = $('#loginPw').value;
    if (!em || !pw) { say('#loginMsg', 'Isi email dan kata sandi.', true); return; }
    $('#loginBtn').disabled = true; say('#loginMsg', 'Masuk...');
    var r = await sb.auth.signInWithPassword({ email: em, password: pw });
    $('#loginBtn').disabled = false;
    if (r.error) say('#loginMsg', r.error.message === 'Invalid login credentials' ? 'Email atau kata sandi salah.' : 'Gagal masuk: ' + r.error.message, true);
    else say('#loginMsg', '');
  });
  $('#magicBtn').addEventListener('click', async function () {
    var em = $('#loginEmail').value.trim().toLowerCase();
    if (!em) { say('#loginMsg', 'Isi email dulu, lalu pilih tautan email.', true); return; }
    say('#loginMsg', 'Mengirim tautan...');
    var er = await sendLink(em);
    say('#loginMsg', er ? 'Gagal mengirim: ' + er.message : 'Cek email ' + em + ' lalu buka tautan masuknya.', !!er);
  });
  $('#forgotBtn').addEventListener('click', async function () {
    var em = $('#loginEmail').value.trim().toLowerCase();
    if (!em) { say('#loginMsg', 'Isi email dulu, lalu pilih lupa kata sandi.', true); return; }
    say('#loginMsg', 'Mengirim tautan...');
    var r = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
    say('#loginMsg', r.error ? 'Gagal mengirim: ' + r.error.message : 'Jika email terdaftar, tautan untuk membuat kata sandi sudah dikirim.', !!r.error);
  });
  $('#resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = $('#resetPw').value, err = $('#resetErr');
    if (pw.length < 8) { err.textContent = 'Kata sandi minimal 8 karakter.'; err.hidden = false; return; }
    var r = await sb.auth.updateUser({ password: pw });
    if (r.error) { err.textContent = 'Gagal menyimpan: ' + r.error.message; err.hidden = false; return; }
    recovering = false; $('#resetPw').value = ''; err.hidden = true;
    history.replaceState(null, '', location.pathname);
    toast('Kata sandi disimpan'); boot();
  });
  $('#gateOut').addEventListener('click', function () { sb.auth.signOut(); });
  document.addEventListener('click', function (e) { if (e.target.closest('#logoutBtn')) sb.auth.signOut(); });
  document.addEventListener('submit', async function (e) {
    if (e.target.id !== 'pwForm') return;
    e.preventDefault();
    var pw = $('#newPw').value, err = $('#pwErr');
    if (pw.length < 8) { err.textContent = 'Kata sandi minimal 8 karakter.'; err.hidden = false; return; }
    var r = await sb.auth.updateUser({ password: pw });
    if (r.error) { err.textContent = 'Gagal menyimpan: ' + r.error.message; err.hidden = false; return; }
    $('#newPw').value = ''; err.hidden = true; toast('Kata sandi disimpan. Lain kali masuk dengan email dan kata sandi.');
  });
  sb.auth.onAuthStateChange(function (ev) {
    if (ev === 'PASSWORD_RECOVERY') { recovering = true; showGate(true, 'Buat kata sandi baru untuk akun ini.', 'reset'); return; }
    if (recovering) return;
    if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') setTimeout(boot, 0);
  });
  boot();
})();
</script>
</body>
</html>
