<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Owner Ordela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: satu kolom tumpuk di ponsel (sapaan, skor, filter status, kartu ringkasan, daftar user, tombol kuning melayang); di layar lebar daftar menjadi tabel. */
:root {
  --bg: #14161b;
  --surface: #1e2128;
  --surface-2: #2a2e37;
  --line: #353a46;
  --fg: #f2f3f6;
  --muted: #9aa1af;
  --accent: #ffc81e;
  --on-accent: #17181c;
  --ok: #9bdc6b;
  --warn: #ff9f43;
  --crit: #ff6b6b;
  --info: #6fb0ff;
  --violet: #a58bff;
  --scrim: rgba(8, 9, 12, .66);
  --font: 'Red Hat Display', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e8eaee; --surface: #ffffff; --surface-2: #f0f1f5; --line: #d5d8e0;
    --fg: #181a20; --muted: #5b6272; --ok: #2b7f1c; --warn: #b05600; --crit: #c02f2d;
    --info: #1c62c4; --violet: #6244d1; --scrim: rgba(20, 22, 28, .45);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e8eaee; --surface: #ffffff; --surface-2: #f0f1f5; --line: #d5d8e0;
  --fg: #181a20; --muted: #5b6272; --ok: #2b7f1c; --warn: #b05600; --crit: #c02f2d;
  --info: #1c62c4; --violet: #6244d1; --scrim: rgba(20, 22, 28, .45);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #14161b; --surface: #1e2128; --surface-2: #2a2e37; --line: #353a46;
  --fg: #f2f3f6; --muted: #9aa1af; --ok: #9bdc6b; --warn: #ff9f43; --crit: #ff6b6b;
  --info: #6fb0ff; --violet: #a58bff; --scrim: rgba(8, 9, 12, .66);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-block: 20px 170px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; align-items: center; gap: 14px; }
.top .who-me { flex: 1; min-width: 0; }
.top .hello { color: var(--muted); font-size: 14px; }
.top h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.avatar {
  --c: var(--info);
  display: grid; place-items: center; flex: none;
  width: 44px; height: 44px; border-radius: 50%;
  font-weight: 700; font-size: 15px; color: var(--c);
  background: color-mix(in srgb, var(--c) 20%, var(--surface-2));
}
.avatar.lg { width: 60px; height: 60px; font-size: 21px; }
.icon-btn {
  position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--line); background: transparent;
}
.icon-btn:hover { background: var(--surface); }
.icon-btn .dot { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Kartu kuning utama */
.hero {
  background: var(--accent); color: var(--on-accent);
  border-radius: 28px; padding: 22px 22px 22px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.hero h2 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.1; }
.hero p { margin: 4px 0 0; font-size: 14px; font-weight: 500; opacity: .8; }
.hero .big { position: relative; width: 92px; height: 92px; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 20px; }
.hero .big svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .big .t { fill: none; stroke: rgba(23, 24, 28, .16); stroke-width: 7; }
.hero .big .v { fill: none; stroke: var(--on-accent); stroke-width: 7; stroke-linecap: round; transition: stroke-dasharray .5s ease; }

/* Filter status */
.sect-label { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: var(--fg); }
.tiles-status { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.chip {
  border: 0; border-radius: 20px; background: var(--surface); padding: 12px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
}
.chip b { font-size: 22px; font-weight: 800; line-height: 1.1; }
.chip span { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] span { color: var(--on-accent); opacity: .8; }

/* Kartu ringkasan */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.stat .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.stat .val { font-size: 32px; font-weight: 700; line-height: 1; }
.stat .lbl { font-weight: 600; }
.stat .hint { font-size: 12.5px; color: var(--muted); }
.ring { --c: var(--info); position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--c) 18%, var(--surface-2)); color: var(--c); }
.ring svg.r { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring .rt { fill: none; stroke: transparent; stroke-width: 3; }
.ring .rv { fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; }
.ring svg.i { width: 18px; height: 18px; position: relative; }

/* Toolbar */
.toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { position: relative; }
.field.search { grid-column: 1 / -1; }
.field .i { position: absolute; left: 14px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.input, .select {
  width: 100%; height: 46px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 14px;
}
.field.search .input { padding-left: 42px; }
.input::placeholder { color: var(--muted); }
.input:focus-visible, .select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

/* Daftar */
.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.list-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.list-head span { color: var(--muted); font-size: 13px; }
.cols { display: none; }
ul.users { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.row {
  width: 100%; text-align: left; border: 0; border-radius: 22px; background: var(--surface);
  padding: 14px 16px; display: grid; gap: 10px 12px; align-items: center;
  grid-template-columns: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "who who who chev" "role stat last last";
}
.row:hover { background: var(--surface-2); }
.who { grid-area: who; display: flex; align-items: center; gap: 12px; min-width: 0; }
.who .txt { min-width: 0; }
.who .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .em { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .you { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--accent); color: var(--on-accent); margin-left: 6px; vertical-align: 1px; }
.c-role { grid-area: role; font-size: 13px; font-weight: 600; color: var(--muted); }
.c-stat { grid-area: stat; }
.c-last { grid-area: last; font-size: 13px; color: var(--muted); }
.chev { grid-area: chev; color: var(--muted); }
.pill {
  --c: var(--ok);
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px;
  font-size: 12.5px; font-weight: 600; color: var(--c);
  background: color-mix(in srgb, var(--c) 16%, transparent);
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.pending { --c: var(--warn); }
.pill.suspended { --c: var(--crit); }
.empty { background: var(--surface); border-radius: 22px; padding: 32px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }
.note { color: var(--muted); font-size: 12.5px; text-align: center; margin: 0; }

@media (min-width: 760px) {
  .tiles-status { max-width: 520px; }
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .toolbar { grid-template-columns: minmax(0, 1fr) 190px 190px; }
  .field.search { grid-column: auto; }
  .cols, .row {
    grid-template-columns: minmax(0, 2.4fr) 110px 140px 150px 20px;
    grid-template-areas: "who role stat last chev";
  }
  .cols { display: grid; gap: 12px; padding: 0 16px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .cols span:nth-child(5) { grid-column: 5; }
}

/* Tombol melayang */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  display: flex; flex-direction: column; gap: 10px;
  padding: 28px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 46%); }
.nav { pointer-events: auto; width: 100%; max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;
  background: color-mix(in srgb, var(--surface) 76%, transparent); border: 1px solid color-mix(in srgb, var(--line) 72%, transparent); border-radius: 30px; padding: 6px;
  -webkit-backdrop-filter: blur(18px) saturate(145%); backdrop-filter: blur(18px) saturate(145%); box-shadow: 0 8px 28px rgba(0,0,0,.12); }
.nav button { border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px 7px; border-radius: 24px; font-size: 12px; font-weight: 600; }
.nav button:hover { color: var(--fg); }
.nav button[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.view { display: flex; flex-direction: column; gap: 22px; }
.card { background: var(--surface); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card h3 { margin: 0; font-size: 17px; font-weight: 700; }
.card .sub { color: var(--muted); font-size: 13px; margin: -8px 0 0; }
.stack { display: flex; height: 16px; border-radius: 99px; overflow: hidden; gap: 3px; }
.stack i { display: block; min-width: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.bars li { display: grid; grid-template-columns: minmax(70px, 38%) minmax(0, 1fr) 28px; align-items: center; gap: 12px; font-size: 14px; }
.bars .bl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .bt { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bars .bt i { display: block; height: 100%; border-radius: 99px; }
.bars b { text-align: right; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fab {
  pointer-events: auto; display: flex; align-items: center; justify-content: space-between;
  width: 100%; max-width: 960px; margin: 0 auto; height: 56px; padding: 0 12px 0 24px; border: 0;
  border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px;
}
.fab .plus { width: 34px; height: 34px; border-radius: 50%; background: var(--on-accent); color: var(--accent); display: grid; place-items: center; }
.fab:hover { filter: brightness(1.05); }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; padding-top: env(safe-area-inset-top, 0px); }
.sheet {
  width: 100%; max-width: 480px; max-height: 92%; overflow: auto; background: var(--surface);
  border-radius: 28px 28px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 28px; padding-bottom: 22px; } }
.sheet-top { display: flex; align-items: center; gap: 14px; }
.sheet-top .txt { flex: 1; min-width: 0; }
.sheet-top h2 { margin: 0; font-size: 21px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.sheet-top .em { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.info div { background: var(--surface-2); border-radius: 16px; padding: 10px 14px; min-width: 0; }
.info dt { font-size: 12px; color: var(--muted); }
.info dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.lbl-f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.lbl-f .input, .lbl-f .select { background: var(--surface-2); color: var(--fg); }
.actions { display: flex; flex-direction: column; gap: 10px; }
.btn { height: 48px; border-radius: 99px; border: 0; background: var(--surface-2); font-weight: 700; padding: 0 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { filter: brightness(1.12); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, var(--surface-2)); }
.btn.solid-danger { background: var(--crit); color: #17181c; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-stack { display: flex; flex-direction: column; gap: 12px; }
.list-head #addOwnerBtn { width: 42px; height: 42px; padding: 0; flex: none; display: grid; place-items: center; border-radius: 50%; }
.list-head #addOwnerBtn svg { width: 21px; height: 21px; }
.confirm { background: color-mix(in srgb, var(--crit) 12%, var(--surface-2)); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.confirm p { margin: 0; font-weight: 600; }
.err { color: var(--crit); font-size: 13px; margin: 0; }
.hint-line { color: var(--muted); font-size: 13px; margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); translate: -50% 12px; z-index: 40;
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px); text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, translate .2s;
}
.toast.show { opacity: 1; translate: -50% 0; }
@media (prefers-reduced-motion: reduce) { .toast, .hero .big .v { transition: none; } }
[hidden] { display: none !important; }
body { margin: 0; }
:root { --mint: #c9e7cf; --on-mint: #16251b; }
.gate { max-width: 440px; margin: 0 auto; padding-top: 3vh; display: flex; flex-direction: column; gap: 14px; }
.login-hero { position: relative; overflow: hidden; background: var(--mint); color: var(--on-mint); border-radius: 32px; padding: 26px 24px 30px; min-height: 250px; display: flex; flex-direction: column; gap: 12px; }
.login-hero .brand { font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.login-hero h1 { margin: 0; font-size: 36px; line-height: 1.08; font-weight: 500; letter-spacing: -.015em; text-wrap: balance; position: relative; z-index: 1; }
.login-hero h1 b { font-weight: 800; }
.login-hero p { margin: 0; max-width: 21ch; font-size: 14.5px; line-height: 1.45; opacity: .82; position: relative; z-index: 1; }
.login-hero svg { position: absolute; right: -34px; bottom: -52px; width: 140px; height: 140px; }
.login-card { background: var(--surface); border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.login-card form { display: flex; flex-direction: column; gap: 14px; }
.pw { position: relative; }
.pw .input { padding-right: 76px; }
.pw button { position: absolute; right: 6px; top: 50%; translate: 0 -50%; height: 34px; padding: 0 12px; border: 0; border-radius: 99px; background: var(--surface); color: var(--muted); font-weight: 600; font-size: 13px; }
.pw button:hover { color: var(--fg); }
.login-alt { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.linkbtn { border: 0; background: transparent; color: var(--fg); font-weight: 600; font-size: 14px; height: 42px; border-radius: 99px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.linkbtn:hover { background: var(--surface-2); }
.gate-msg { margin: 0; font-weight: 600; }

.pill.new { --c: var(--info); }
.chip { padding-inline: 2px; }
.chip span { font-size: 11.5px; }
.c-role { min-width: 0; font-size: 13px; }
.c-role b { display: block; font-weight: 700; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-role small { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.row { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "who who chev" "role stat stat" "last last last"; }
@media (min-width: 760px) {
  .cols, .row { grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.4fr) 130px 130px 20px; grid-template-areas: "who role stat last chev"; }
}
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); border-radius: 99px; padding: 4px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font-weight: 600; height: 38px; border-radius: 99px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow: auto; }
.log li { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.log .l { min-width: 0; overflow-wrap: anywhere; }
.log .r { color: var(--muted); white-space: nowrap; font-size: 12.5px; text-align: right; }

/* Subscription UI */
.sr-only { position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.list-head #addOwnerBtn { width:auto; min-width:44px; height:44px; padding:0 15px; border-radius:15px; gap:8px; }
.list-head #addOwnerBtn .users-add { width:21px; height:21px; }
.subscription-intro { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:190px; padding:25px 26px; border-radius:28px; background:var(--accent); color:var(--on-accent); }
.subscription-intro-copy { position:relative; z-index:1; max-width:590px; }
.section-kicker { display:block; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.14em; margin-bottom:7px; }
.subscription-intro .section-kicker { color:rgba(23,24,28,.62); }
.subscription-intro h2 { margin:0; max-width:19ch; font-size:clamp(22px,4vw,30px); line-height:1.12; font-weight:800; letter-spacing:-.025em; }
.subscription-intro p { margin:8px 0 0; max-width:48ch; font-size:13.5px; opacity:.78; }
.trial-note { display:flex; align-items:center; gap:10px; margin-top:18px; max-width:440px; }
.trial-icon { width:42px; height:42px; flex:none; display:grid; place-items:center; border-radius:14px; background:rgba(23,24,28,.12); font-size:17px; font-weight:800; }
.trial-note b,.trial-note small { display:block; }
.trial-note b { font-size:13px; }
.trial-note small { margin-top:2px; font-size:11.5px; opacity:.72; }
.intro-art { width:126px; height:126px; flex:none; display:grid; place-items:center; border-radius:28px; background:rgba(23,24,28,.09); transform:rotate(5deg); }
.intro-art svg { width:100px; height:100px; fill:none; stroke:var(--on-accent); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
.subscription-overview { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }

/* Tanpa zoom dan salin teks (kecuali di kolom isian) */
html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
body { touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
input, textarea, select { -webkit-user-select: text; user-select: text; }
img { -webkit-user-drag: none; user-drag: none; }
.input, .select { font-size: 16px; }

/* Semua tombol memberi respons */
button { transition: transform .12s ease, filter .15s ease, background-color .15s ease, opacity .15s ease; }
button:active:not(:disabled) { transform: scale(.965); }
.row:active:not(:disabled) { transform: scale(.985); }
.nav button:active:not(:disabled) { transform: scale(.94); }
button.loading { position: relative; color: transparent !important; pointer-events: none; }
button.loading::after { content: ""; position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--fg); animation: spin .7s linear infinite; }
.btn.primary.loading::after { border-color: rgba(0, 0, 0, .22); border-top-color: var(--on-accent); }
.btn.solid-danger.loading::after { border-color: rgba(0, 0, 0, .22); border-top-color: var(--on-accent); }
@keyframes spin { to { rotate: 360deg; } }
.avatar { overflow: hidden; }
button.avatar { border: 0; padding: 0; cursor: pointer; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* profil */

<body>

<main class="gate" id="gate" hidden>

    <span class="brand">Ordela</span>

    <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="#1e2128"/><g stroke="#c9e7cf" stroke-width="12" stroke-linecap="round" fill="none"><path d="M100 100 100 22M100 100 32 140M100 100 168 140"/><circle cx="100" cy="100" r="64"/></g></svg>
  </section>
  <section class="login-card">
    <p class="gate-msg" id="gateMsg" role="status" hidden></p>
    <form id="loginForm" novalidate>
      <label class="lbl-f" for="loginEmail">Email<input class="input" id="loginEmail" type="email" autocomplete="username" placeholder="nama@email.com"></label>
      <label class="lbl-f" for="loginPw">Kata sandi<span class="pw"><input class="input" id="loginPw" type="password" autocomplete="current-password" placeholder="Kata sandi"><button type="button" id="pwToggle" aria-label="Tampilkan kata sandi">Lihat</button></span></label>
      <p class="hint-line" id="loginMsg" role="status" style="margin:0"></p>
      <button type="submit" class="btn primary" id="loginBtn">Masuk</button>
    </form>
    <div class="login-alt" id="loginAlt">
      <button type="button" class="linkbtn" id="magicBtn">Masuk lewat tautan email</button>
      <button type="button" class="linkbtn" id="forgotBtn">Lupa atau belum punya kata sandi?</button>
    </div>
    <form id="resetForm" hidden novalidate>
      <label class="lbl-f" for="resetPw">Kata sandi baru<input class="input" id="resetPw" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter"></label>

<script>
(function () {

    var pwt = e.target.closest('[data-pwt]');
    if (pwt) { var pi = $('#' + pwt.dataset.pwt), sh = pi.type === 'password'; pi.type = sh ? 'text' : 'password'; pwt.textContent = sh ? 'Sembunyi' : 'Lihat'; return; }
    if (e.target.closest('#photoDel')) { pendingPhoto = null; $('#profAv').innerHTML = esc(initials($('#profName').value || adminEmail.split('@')[0])); $('#photoDel').disabled = true; toast('Foto akan dihapus, tekan Simpan'); }
  });
  document.addEventListener('submit', async function (e) {
    var id = e.target.id;
    if (id !== 'pwForm' && id !== 'profForm') return;
    e.preventDefault();
    var btn = e.target.querySelector('button[type="submit"]');
    if (id === 'pwForm') {
      var pw = $('#newPw').value, err = $('#pwErr');
      if (pw.length < 8) { err.textContent = 'Kata sandi minimal 8 karakter.'; err.hidden = false; return; }
      setBusy(btn, true);
      var r = await sb.auth.updateUser({ password: pw });
      setBusy(btn, false);
      if (r.error) { err.textContent = 'Gagal menyimpan: ' + r.error.message; err.hidden = false; return; }
      $('#newPw').value = ''; err.hidden = true; toast('Kata sandi disimpan. Lain kali masuk dengan email dan kata sandi.');
      return;
    }
    var perr = $('#profErr'), payload = { name: $('#profName').value.trim(), phone: $('#profPhone').value.trim(), birth: $('#profBirth').value, address: $('#profAddr').value.trim() };
    if (pendingPhoto !== undefined) payload.photo = pendingPhoto;
    setBusy(btn, true);
    try {
      var p = await api('set_profile', payload);
      profile = normProfile(p);
      paintMe(); renderProfile(); toast('Profil disimpan');
    } catch (er) { setBusy(btn, false); perr.textContent = 'Gagal menyimpan: ' + er.message; perr.hidden = false; }
  });
  sb.auth.onAuthStateChange(function (ev) {
    if (ev === 'PASSWORD_RECOVERY') { recovering = true; showGate(true, 'Buat kata sandi baru untuk akun ini.', 'reset'); return; }
    if (recovering) return;
    if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') setTimeout(boot, 0);
  });
  /* Tanpa zoom dan salin teks, kecuali di kolom isian */
  function inField(t) { return !!(t && t.closest && t.closest('input, textarea, select')); }
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }); });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  ['copy', 'cut', 'dragstart', 'selectstart', 'contextmenu'].forEach(function (n) { document.addEventListener(n, function (e) { if (!inField(e.target)) e.preventDefault(); }); });
  document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].indexOf(e.key) > -1) e.preventDefault(); });

  boot();
})();
</script>
